<html>

<body>
	<h2>Add Bike Information</h2>
	<form action="addbike" method="post">
		<table border="1">
			<tr>
				<td>Enter Bike Id</td>
				<td><input type="text" name="bikeid" /></td>
			</tr>
			<tr>
				<td>Enter Bike Make</td>
				<td><input type="text" name="make" /></td>
			</tr>
			<tr>
				<td>Enter Bike Model</td>
				<td><input type="text" name="model" /></td>
			</tr>
		</table>
		<button type="submit">Add Bike</button>
	</form>
</body>

</html>
