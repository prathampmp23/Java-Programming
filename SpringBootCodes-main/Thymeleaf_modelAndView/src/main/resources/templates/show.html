<html>

<body>
	<h2>Student List</h2>
	<table border="1">
		<thead>
			<tr>
				<th>ID</th>
				<th>Name</th>
				<th>City</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="student : ${data}">
				<td th:text="${student.stuid}"></td>
				<td th:text="${student.name}"></td>
				<td th:text="${student.branch}"></td>
			</tr>
		</tbody>
	</table>

</body>
