spring:
  application:
    name: GATEWAY-SERVICE
  cloud:
    gateway:
      server:
        webmvc:
          routes:
           - id: POST-SERVICE
             uri: lb://POST-SERVICE
             predicates:
               - Path=/api/posts/**
           - id: COMMENTS-SERVICE
             uri: lb://COMMENTS-SERVICE
             predicates:
               - Path=/api/comments/**						 
server:
  port: 8765
  
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true